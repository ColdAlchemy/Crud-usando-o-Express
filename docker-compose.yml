# docker compose up --build
# Defina JWT_SECRET no ambiente ou em um arquivo .env ao lado deste (o compose lê o .env automaticamente).
# Dados de demonstração:  docker compose run --rm api node src/seed.js
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (veja .env.example)}
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
